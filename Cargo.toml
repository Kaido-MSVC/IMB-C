[package]
name = "imb-c"
version = "1.3.3"
edition = "2024"
license = "MIT"
authors = ["Kaido-MSVC"]
publish = false
default-run = "imb-c"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
rfd = "=0.17.2"
rayon = "=1.12.0"
tempfile = "=3.27.0"
sha2 = "=0.10.9"

# 相依套件不產生除錯資訊，縮小 debug 產物（自己的程式碼仍保留完整除錯資訊）
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

