[package]
name = "imb-c"
version = "1.3.0"
edition = "2024"
license = "MIT"
authors = ["Kaido-MSVC"]
publish = false
default-run = "imb-c"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
rfd = "=0.17.2"
rayon = "=1.12.0"
tempfile = "=3.27.0"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
strip = true

